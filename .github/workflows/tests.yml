name: tests

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skill/game-voice-intelligence/scripts/validate_run.py data/raw/latest_manifest.json reports/tower-of-fantasy/analysis_summary.json
